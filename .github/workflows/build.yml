name: Build GKI 5.4 Kernel for Realme C33 (RMX3624)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zstd lz4 cpio rsync

      - name: Download Clang Toolchain (AOSP r416183b)
        run: |
          mkdir -p /home/runner/work/toolchain/clang
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C /home/runner/work/toolchain/clang
          rm -f clang.tar.gz

      - name: Clone AOSP common-android12-5.4 Kernel Source
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common.git -b android12-5.4-lts /home/runner/work/kernel

      - name: Integrate KernelSU-Next
        working-directory: /home/runner/work/kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Apply Vendor Module Compatibility & Permissive SELinux Patches
        working-directory: /home/runner/work/kernel
        run: |
          sed -i 's/return -ENOEXEC;/return 0;/g' kernel/module.c
          find KernelSU-Next -not -path "*/.git/*" -type f -exec sed -i "s|<linux/pgtable.h>|<asm/pgtable.h>|g; s|strncpy_from_user_nofault|strncpy_from_user|g; s|copy_to_kernel_nofault|probe_kernel_write|g" {} +
          sed -i 's/bool selinux_is_enforcing(void)/bool selinux_is_enforcing(void) { return false; } bool _unused_selinux_is_enforcing(void)/g' security/selinux/include/security.h || true

      - name: Configure Kernel (GKI + eBPF + KSU)
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_INET_UDP_DIAG \
            -e CONFIG_INET_TCP_DIAG \
            -e CONFIG_SECURITY_SELINUX_DEVELOP \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_UAPI_HEADER_TEST \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Image
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 Image.gz

      - name: Upload Compiled Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX3624-GKI-5.4-Image-gz
          path: /home/runner/work/kernel/out/arch/arm64/boot/Image.gz
