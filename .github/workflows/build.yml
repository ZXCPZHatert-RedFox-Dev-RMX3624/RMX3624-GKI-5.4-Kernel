name: Build Custom Unisoc ums9230 Kernel 5.4 rev11 (KernelSU-Next + A16/A17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo with RMX3624 stock_config
        uses: actions/checkout@v4

      - name: Maximize disk space & add 12GB Swap for LTO
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 12G /swapfile_lto
          sudo chmod 600 /swapfile_lto
          sudo mkswap /swapfile_lto
          sudo swapon /swapfile_lto
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zstd lz4 cpio rsync clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download Clang Toolchain (AOSP r416183b)
        run: |
          mkdir -p /home/runner/work/toolchain/clang/bin && for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-symbolizer llvm-ranlib llvm-size; do ln -sf /usr/bin/${t}-12 /home/runner/work/toolchain/clang/bin/${t}; done

      - name: Clone Unisoc ums9230 (RMX3511/RMX3624) 5.4 Kernel Source
        run: |
          git clone --depth=1 https://github.com/rifsxd/android_kernel_realme_RMX3511.git /home/runner/work/kernel

      - name: Integrate KernelSU-Next & Apply Vendor Compatibility Patches
        working-directory: /home/runner/work/kernel
        run: |
          rm -rf KernelSU KernelSU-Next drivers/kernelsu && sed -i "/kernelsu/d" drivers/Kconfig drivers/Makefile
          curl -LSs "https://githubusercontent.com" | bash -s legacy
          sed -i 's/return -ENOEXEC;/return 0;/g' kernel/module.c
          sed -i 's/bool selinux_is_enforcing(void)/bool selinux_is_enforcing(void) { return false; } bool _unused_selinux_is_enforcing(void)/g' security/selinux/include/security.h || true
          sed -i 's/-rev6/-rev11-Flagship-KSUNext/g' Makefile || true

      - name: Configure Kernel (RMX3624 + KernelSU-Next + Full eBPF + EROFS + A16/A17)
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          mkdir -p out
          cp $GITHUB_WORKSPACE/arch/arm64/configs/rmx3624_defconfig out/.config
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_WIREGUARD -e CONFIG_ZSMALLOC -e CONFIG_ZRAM -e CONFIG_CRYPTO_LZ4 -e CONFIG_CRYPTO_ZSTD -e CONFIG_ZSTD_COMPRESS -e CONFIG_ZSTD_DECOMPRESS -e CONFIG_BOEFFLA_WL_BLOCKER -e CONFIG_TCP_CONG_WESTWOOD -e CONFIG_TCP_CONG_HTCP -e CONFIG_DEFAULT_BBR --set-str CONFIG_DEFAULT_TCP_CONG bbr -e CONFIG_IP_NF_TARGET_TTL -e CONFIG_IP6_NF_TARGET_HL -e CONFIG_NETFILTER_XT_TARGET_HL -e CONFIG_ZSWAP -e CONFIG_CLEANCACHE -e CONFIG_FRONTSWAP -e CONFIG_EXFAT_FS -e CONFIG_NTFS_FS -e CONFIG_ISO9660_FS -e CONFIG_UDF_FS -e CONFIG_HID_SONY -e CONFIG_HID_NINTENDO -e CONFIG_JOYSTICK_XPAD -e CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE \
            -e CONFIG_FUSE_FS \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_BPF_KPROBE_OVERRIDE \
            -e CONFIG_BPF_STREAM_PARSER \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_INET_UDP_DIAG \
            -e CONFIG_INET_TCP_DIAG \
            -e CONFIG_EROFS_FS \
            -e CONFIG_EROFS_FS_XATTR \
            -e CONFIG_EROFS_FS_POSIX_ACL \
            -e CONFIG_EROFS_FS_SECURITY \
            -e CONFIG_EROFS_FS_ZIP \
            -e CONFIG_EROFS_FS_ZIP_LZMA \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_F2FS_FS_COMPRESSION \
            -e CONFIG_F2FS_FS_LZ4 \
            -e CONFIG_F2FS_FS_ZSTD \
            -e CONFIG_PSI \
            -e CONFIG_MEMCG \
            -e CONFIG_CGROUP_SCHED \
            -e CONFIG_CGROUP_PIDS \
            -e CONFIG_CGROUP_FREEZER \
            -e CONFIG_CPUSETS \
            -e CONFIG_SECURITY_SELINUX_DEVELOP \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_UAPI_HEADER_TEST \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_LOCALVERSION_AUTO
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Image.gz & Modules
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error" Image.gz && (make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error" -k modules || true)
          mkdir -p out/modules_inst
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=modules_inst INSTALL_MOD_STRIP=1 modules_install || true
          tar -czf out/modules_rev11.tar.gz -C out/modules_inst .

      - name: Upload Compiled Kernel & Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX3624-GKI-5.4-Image-rev11-Flagship-KSUNext
          path: |
            /home/runner/work/kernel/out/arch/arm64/boot/Image.gz
            /home/runner/work/kernel/out/modules_rev11.tar.gz
