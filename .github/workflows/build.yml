name: Build Custom Unisoc ums9230 Kernel 5.4 (rev9)

on:
  workflow_dispatch:

name: Build Custom Unisoc ums9230 Kernel 5.4 (rev9 A15/A16/A17 + Signed Boot) for RMX3624

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo with RMX3624 config & ramdisk
        uses: actions/checkout@v4

      - name: Maximize disk space & add 12GB Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 12G /swapfile_lto
          sudo chmod 600 /swapfile_lto
          sudo mkswap /swapfile_lto
          sudo swapon /swapfile_lto

      - name: Install dependencies & Android Boot/AVB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zstd lz4 cpio rsync clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu mkbootimg avbtool openssl

      - name: Setup Clang Toolchain
        run: |
          mkdir -p /home/runner/work/toolchain/clang/bin && for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-symbolizer llvm-ranlib llvm-size; do ln -sf /usr/bin/${t}-12 /home/runner/work/toolchain/clang/bin/${t}; done

      - name: Clone Unisoc ums9230 (RMX3511/RMX3624) 5.4 Kernel Source
        run: |
          git clone --depth=1 https://github.com/rifsxd/android_kernel_realme_RMX3511.git /home/runner/work/kernel

      - name: Apply Vendor Module Compatibility, Permissive SELinux & rev9 Version
        working-directory: /home/runner/work/kernel
        run: |
          sed -i 's/return -ENOEXEC;/return 0;/g' kernel/module.c
          sed -i 's/bool selinux_is_enforcing(void)/bool selinux_is_enforcing(void) { return false; } bool _unused_selinux_is_enforcing(void)/g' security/selinux/include/security.h || true
          sed -i 's/-rev6/-rev9-A16-A17/g' Makefile || true

      - name: Configure Kernel (rev9: KSU + BBR + WireGuard + ZRAM ZSTD + Wakelock Blocker + A16/A17)
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          mkdir -p out
          cp $GITHUB_WORKSPACE/arch/arm64/configs/rmx3624_defconfig out/.config
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_DEFAULT_BBR \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr" \
            -e CONFIG_WIREGUARD \
            -e CONFIG_FUSE_FS \
            -e CONFIG_ZSMALLOC \
            -e CONFIG_ZRAM \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_CRYPTO_ZSTD \
            -e CONFIG_ZSTD_COMPRESS \
            -e CONFIG_ZSTD_DECOMPRESS \
            -e CONFIG_BOEFFLA_WL_BLOCKER \
            -e CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_BPF_KPROBE_OVERRIDE \
            -e CONFIG_BPF_STREAM_PARSER \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_INET_UDP_DIAG \
            -e CONFIG_INET_TCP_DIAG \
            -e CONFIG_EROFS_FS \
            -e CONFIG_EROFS_FS_XATTR \
            -e CONFIG_EROFS_FS_POSIX_ACL \
            -e CONFIG_EROFS_FS_SECURITY \
            -e CONFIG_EROFS_FS_ZIP \
            -e CONFIG_EROFS_FS_ZIP_LZMA \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_F2FS_FS_COMPRESSION \
            -e CONFIG_F2FS_FS_LZ4 \
            -e CONFIG_F2FS_FS_ZSTD \
            -e CONFIG_PSI \
            -e CONFIG_MEMCG \
            -e CONFIG_CGROUP_SCHED \
            -e CONFIG_CGROUP_PIDS \
            -e CONFIG_CGROUP_FREEZER \
            -e CONFIG_CPUSETS \
            -e CONFIG_SECURITY_SELINUX_DEVELOP \
            -d CONFIG_DEBUG_FS \
            -d CONFIG_FTRACE \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_UAPI_HEADER_TEST \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_LOCALVERSION_AUTO
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile & Pack AVB-Signed boot_rev9_signed.img
        working-directory: /home/runner/work/kernel
        run: |
          export PATH="/home/runner/work/toolchain/clang/bin:$PATH"
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error" Image.gz
          mkdir -p /tmp/release_out
          cp out/arch/arm64/boot/Image.gz /tmp/release_out/Image-rev9.gz
          mkbootimg --header_version 4 \
            --kernel out/arch/arm64/boot/Image.gz \
            --ramdisk $GITHUB_WORKSPACE/prebuilt/ramdisk.lz4 \
            --os_version 13.0.0 \
            --os_patch_level 2024-05 \
            -o /tmp/release_out/boot_rev9_signed.img
          openssl genrsa -out /tmp/testkey_rsa4096.pem 4096
          avbtool add_hash_footer \
            --image /tmp/release_out/boot_rev9_signed.img \
            --partition_size 67108864 \
            --partition_name boot \
            --key /tmp/testkey_rsa4096.pem \
            --algorithm SHA256_RSA4096 \
            --rollback_index 3
          avbtool info_image --image /tmp/release_out/boot_rev9_signed.img

      - name: Upload Ready-to-Flash Signed Boot & Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMX3624-Kernel-rev9-Signed-Boot
          path: /tmp/release_out/
